[package]
name = "mathcore-constants"
version = "0.1.0"
description = "Physical, mathematical, and chemical constants with units, uncertainty, and citations for the mathcore/thales ecosystem"
readme = "README.md"
repository = "https://github.com/ChrisGVE/mathcore-constants"
documentation = "https://docs.rs/mathcore-constants"
homepage = "https://github.com/ChrisGVE/mathcore-constants"
keywords = ["constants", "physics", "codata", "science", "units"]
categories = ["mathematics", "science"]
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true

[dependencies]
mathcore-units = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["mathcore-units/std"]
serde = ["dep:serde", "mathcore-units/serde"]

[dev-dependencies]
serde_json = { workspace = true }
